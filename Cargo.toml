[package]
name = "jira-ticket-spider"
version = "0.1.0" # Managed by `release.sh`
authors = ["Zacchary Dempsey-Plante <zacc@ztdp.ca>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zedseven/jira-ticket-spider"
homepage = "https://github.com/zedseven/jira-ticket-spider"
description = """
A utility for crawling Jira tickets based on their links, then creating a visual map of how they relate to each other. \
Outputs in PlantUML format on `stdout`.
"""

[profile.release]
codegen-units = 1
lto = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.1", features = ["wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
